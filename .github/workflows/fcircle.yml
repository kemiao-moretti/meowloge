name: FCircle

# 每日北京时间 05:00（UTC 21:00）由 data/links.yaml 生成 static/fcircle.json；
# 支持手动触发。产物随 Cloudflare Pages 部署后在 /fcircle.json 可达。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcircle
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 PyYAML
        run: pip install pyyaml --quiet

      - name: 生成 fcircle.json
        run: python3 .github/scripts/gen_fcircle.py

      - name: 校验产物
        run: |
          python3 - <<'PY'
          import json
          with open("static/fcircle.json", encoding="utf-8") as f:
              data = json.load(f)
          friends = data["friends"]
          assert isinstance(friends, list) and friends, "friends 必须是非空数组"
          for i, item in enumerate(friends):
              assert isinstance(item, list) and len(item) == 4, f"第 {i} 条不是 4 元组"
              assert item[1].startswith("http"), f"第 {i} 条 link 非法: {item[1]}"
              assert item[2].startswith("http"), f"第 {i} 条 linkpage 非法: {item[2]}"
              assert item[3].startswith("http"), f"第 {i} 条 avatar 非法: {item[3]}"
          print(f"校验通过：{len(friends)} 条友链")
          PY

      - name: 提交变更
        run: |
          if git diff --quiet static/fcircle.json; then
            echo "fcircle.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/fcircle.json
          git commit -m "friends: update fcircle.json"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "第 ${i} 次推送失败，重试…"
            sleep 5
          done
          echo "推送连续失败，退出" >&2
          exit 1
