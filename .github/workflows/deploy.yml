# Hugo 博客构建并部署到 Cloudflare Pages
# 前置条件（在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置）：
#   CLOUDFLARE_API_TOKEN  —— Cloudflare API Token，需 Account / Cloudflare Pages / Edit 权限
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账户 ID（Dashboard 右侧栏可见）
#   AI_SUMMARY_API        —— 可选，AI 摘要 API 地址
#   AI_SUMMARY_API_KEY    —— AI 摘要 API 密钥
# 说明：wrangler pages deploy 在目标项目不存在时会自动创建（项目名：blog）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_summaries:
        description: Regenerate eligible post AI summaries; keep ai_summary=false opt-outs skipped
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含主题 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive # 拉取 themes/solitude
          fetch-depth: 0

      - name: 记录构建基线
        shell: bash
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 生成缺失 AI 摘要
        env:
          AI_SUMMARY_API: ${{ secrets.AI_SUMMARY_API }}
          AI_SUMMARY_API_KEY: ${{ secrets.AI_SUMMARY_API_KEY }}
          AI_SUMMARY_MODEL: ${{ vars.AI_SUMMARY_MODEL || 'Qwen/Qwen3-8B' }}
          AI_SUMMARY_MAX_INPUT: ${{ vars.AI_SUMMARY_MAX_INPUT }}
          AI_SUMMARY_PROMPT: ${{ vars.AI_SUMMARY_PROMPT }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub leaves optional vars as an empty environment value; unset the numeric
          # option so the script falls back to its built-in 12000-character limit.
          if [ -z "${AI_SUMMARY_MAX_INPUT:-}" ]; then unset AI_SUMMARY_MAX_INPUT; fi
          args=()
          if [ "${{ inputs.force_summaries }}" = "true" ]; then args+=(--force); fi
          node scripts/generate-ai-summary.mjs "${args[@]}"

      - name: 归一化 changelog 构建字段
        run: node scripts/ensure-content-defaults.mjs

      - name: 安装 Hugo（extended）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: 记录构建前工作树状态
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 构建前 assets/jsconfig.json ==="
          if [ -f assets/jsconfig.json ]; then
            sha256sum assets/jsconfig.json
          else
            echo "构建前文件不存在（预期：由 Hugo js.Build 在构建时生成）"
          fi
          echo "=== 构建前目标文件 diff ==="
          git diff -- assets/jsconfig.json
          echo "=== 构建前工作树 ==="
          git status --short --untracked-files=all

      - name: 构建
        run: |
          hugo --minify
          rm -f public/_worker.js

      - name: 记录构建后工作树状态
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 构建后 assets/jsconfig.json ==="
          if [ -f assets/jsconfig.json ]; then
            sha256sum assets/jsconfig.json
          else
            echo "构建后文件仍不存在"
          fi
          echo "=== 构建后目标文件 diff ==="
          git diff -- assets/jsconfig.json
          echo "=== 构建后工作树 ==="
          git status --short --untracked-files=all

      - name: 检查产物
        shell: bash
        run: |
          test -f public/index.html
          test -f public/p/shortcode-showcase.html

      - name: 提交自动生成的 front matter
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short -- content/posts content/changelog)"
          unexpected="$(git status --short | grep -vE '^[ MARC?]{2} (content/posts/|content/changelog/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "发现非预期工作树变更："
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ -z "$changed" ]; then
            echo "没有需要提交的自动生成字段"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${BASE_SHA}" ]; then
            echo "origin/main 在本次构建期间发生变化，拒绝覆盖 CMS 新提交"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts content/changelog
          git commit -m "ci: generate content metadata" -m "Made-with: Proma"
          git push origin HEAD:main

      - name: 确保 Cloudflare Pages 项目存在（不存在则创建，已存在则跳过）
        run: |
          npm i -g wrangler@3.90.0
          npx wrangler pages project create blog --production-branch=main \
            || echo "项目已存在，跳过创建"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=blog --commit-dirty=true

      # 主页 homepage 从本仓库的 RSS 抓文章，这里在博客上线后主动通知它重建，
      # 把最新文章同步进主页。令牌 HOMEPAGE_TRIGGER_TOKEN 见仓库 Secret。
      - name: 通知 homepage 同步文章
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.HOMEPAGE_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kemiao-moretti/homepage/dispatches \
            -d '{"event_type":"blog-updated","client_payload":{"force":1}}')
          echo "dispatch HTTP $code"
          # 204 = 事件已接收；4xx 通常是令牌/权限问题，直接暴露错误
          [ "$code" = "204" ] || exit 1

