# Hugo 博客构建并部署到 Cloudflare Pages
# 前置条件（在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置）：
#   CLOUDFLARE_API_TOKEN  —— Cloudflare API Token，需 Account / Cloudflare Pages / Edit 权限
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账户 ID（Dashboard 右侧栏可见）
# 说明：wrangler pages deploy 在目标项目不存在时会自动创建（项目名：blog）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发，作为备用手段

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含主题 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive # 拉取 themes/solitude
          fetch-depth: 0

      - name: 安装 Hugo（extended）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: 构建
        run: hugo --minify

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=blog
