name: Friend Links Check

# 每日北京时间 02:00（UTC 18:00）巡检友链可达性；支持手动触发。
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: friend-links-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 PyYAML
        run: pip install pyyaml --quiet

      - name: 执行巡检
        id: check
        env:
          ACTION: check
        run: python3 .github/scripts/friend_links.py

      - name: 同步墓碑迁移结果到 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("result-check.json")) return;
            const result = JSON.parse(fs.readFileSync("result-check.json", "utf8"));
            const LABEL = "失联";
            const needLabel = (result.buried || []).some((x) => x.issue_id);
            if (needLabel) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
              } catch {
                await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: "d93f0b" });
              }
            }
            for (const dead of result.buried || []) {
              if (!dead.issue_id) continue;
              try {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: dead.issue_id, labels: [LABEL],
                });
              } catch (e) {
                console.log(`addLabels 失败 #${dead.issue_id}: ${e.message}`);
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: dead.issue_id,
                body: `⚠️ 每日巡检发现你的站点无法访问（${dead.reason}），已连续 2 天失败，友链「${dead.name}」已移入底部「友链墓碑」分组。\n\n站点恢复访问后会由巡检机器人自动搬回原分组；也可评论 \`/retry\` 重新触发审核。`,
              });
            }
            for (const alive of result.revived || []) {
              if (!alive.issue_id) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: alive.issue_id, name: LABEL,
                });
              } catch (e) {
                console.log(`removeLabel 跳过 #${alive.issue_id}: ${e.message}`);
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: alive.issue_id,
                body: `🎉 巡检发现你的站点已恢复访问，友链「${alive.name}」已从「友链墓碑」搬回「${alive.group}」分组，欢迎回来！`,
              });
            }

      - name: 提交 yaml 变更
        run: |
          if git diff --quiet data/links.yaml; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.yaml
          git commit -m "friends: daily reachability check"
          git push
