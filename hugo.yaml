# ============ 站点全局设置 ============

# 博客的访问地址（部署域名），RSS/SEO/分享链接都会基于它生成
baseURL: https://blog.518339.xyz/
# 站点名称，显示在浏览器标签页标题、页头左上角等位置
title: 喵洛阁
# 站点区域设置，影响日期格式等本地化表现
locale: zh-CN
# 默认内容语言，影响页面的 lang 属性与主题的多语言文案选择
defaultContentLanguage: zh-cn
# 时区，影响文章日期显示与构建时的时间计算
timeZone: Asia/Shanghai
# 是否生成 robots.txt（搜索引擎抓取规则文件，位于站点根路径）
enableRobotsTXT: true
# 是否启用 Git 信息（显示每篇文章的最后提交时间，需要文章在 git 仓库中）
enableGitInfo: false
# URL 风格：posts 设为 true 表示文章使用 /p/xxx.html 这种带扩展名的"丑链接"
uglyURLs:
  posts: true
# 使用的主题，对应 themes/ 目录下的文件夹名（themes/solitude）
theme: solitude

# ============ 输出格式 ============
# 控制各类页面生成哪些输出：HTML 是页面本身，RSS 是订阅源，
# Search 和 Links 是 solitude 主题扩展的输出（本地搜索索引 / 链接数据）
outputs:
  home: [HTML, RSS, Search, Links] # 首页额外生成搜索索引和链接数据
  section: [HTML, RSS] # 列表页（如分类/标签下的文章列表）
  taxonomy: [HTML, RSS] # 分类/标签总览页
  term: [HTML, RSS] # 单个分类/标签页

# ============ 分页 ============
# 每页显示的文章数量（文章列表页每页 10 篇）
pagination:
  pagerSize: 10

# ============ 文章链接格式 ============
# 文章的永久链接规则：所有文章 URL 为 /p/文章slug 的形式，
# slug 取自文章 front matter 里的 slug 或文件名
permalinks:
  posts: /p/:slug

# ============ 导航菜单 ============
# 控制页头导航栏的结构。identifier 表示"父级菜单项"（点击弹出子菜单），
# pageRef 指向站内页面，weight 越小排得越靠前
menus:
  main:
    # "文库"父菜单：只作为分组，不带链接，鼠标悬停/点击展开子项
    - name: 文库
      identifier: library
      weight: 10
    # "友链"父菜单
    - name: 友链
      identifier: friends
      weight: 20
    # "项目"父菜单
    - name: 页面
      identifier: personal
      weight: 30
    # "留言"父菜单（说说等内容向互动入口）
    - name: 留言
      identifier: message
      weight: 40
    # ↓ 以下是"文库"下的子菜单
    - name: 全部文章 # 子菜单显示文字
      pageRef: /archives # 指向归档页（全部文章列表）
      parent: library # 归属哪个父菜单（对应上面的 identifier）
      weight: 10 # 在兄弟子菜单中的排序
      params:
        icon: fas fa-folder-closed # 菜单项图标（Font Awesome 类名）
    - name: 全部分类
      pageRef: /categories # 指向分类总览页
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags # 指向标签总览页
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 相册
      pageRef: /gallery # 指向相册页（纸张相册模板）
      parent: personal
      weight: 20
      params:
        icon: fas fa-images
    - name: 数据统计
      pageRef: /stats # 指向数据统计页（ECharts 图表 + 写作热力图）
      parent: library
      weight: 50
      params:
        icon: fas fa-chart-simple
    - name: AI 日报
      pageRef: /ai-news
      parent: personal
      weight: 10
      params:
        icon: fas fa-newspaper
    # ↓ 以下是"友链"下的子菜单
    - name: 友情链接
      pageRef: /links # 指向友链页
      parent: friends
      weight: 10
      params:
        icon: fas fa-link
    # 友链交换页（申请入口，插在友情链接与宝藏博主之间）
    - name: 友链交换
      pageRef: /exchange
      parent: friends
      weight: 15
      params:
        icon: fas fa-handshake
    # 友链朋友圈（fcircle）：聚合友链站点的最新文章
    - name: 友链朋友圈
      pageRef: /fcircle
      parent: friends
      weight: 20
      params:
        icon: fas fa-circle-nodes
    # "宝藏博主"没有 pageRef，而是用 action: travelling（主题内置的开往/漫游行为）
    - name: 宝藏博主
      parent: friends
      weight: 25
      params:
        action: travelling
        icon: fas fa-gift
    # ↓ 以下是"项目"下的子菜单
    # - name: 我的装备
    #   pageRef: /equipment # 指向装备页
    #   parent: personal
    #   weight: 30
    #   params:
    #     icon: fas fa-cogs
    - name: 关于我
      pageRef: /about # 指向关于页
      parent: personal
      weight: 20
      params:
        icon: fas fa-user
    - name: 更新日志
      pageRef: /changelog # 指向更新日志页（changelog 内容集合）
      parent: personal
      weight: 40
      params:
        icon: fas fa-clock-rotate-left
    # ↓ 以下是"留言"下的子菜单
    - name: 说说
      pageRef: /shuoshuo # 指向 Ech0 说说页
      parent: message
      weight: 10
      params:
        icon: fas fa-comment-dots
    - name: 留言板
      pageRef: /message # 指向主题内置的 message 弹幕留言板页
      parent: message
      weight: 20
      params:
        icon: fas fa-envelope

# ============ 站点参数（主题相关的所有配置都在 params 下） ============
params:
  # 作者信息
  author:
    name: 克喵Moretti # 作者名，显示在文章页作者栏、页脚等处
    email: mcy@kemiaosw.top # 作者邮箱，部分主题位置会展示或用于头像
  # 站点描述（slogan），显示在页脚、SEO meta description 中
  description: 克喵的小站，记录着我的一些文字~

  # ===== solitude 主题专属配置 =====
  solitude:
    # --- 纸张手账主题令牌（styles.html 注入为 --solitude-theme-* 变量） ---
    theme_color:
      light: "#6B9A78" # 亮色强调色（纸张植物绿）
      dark: "#8FC29A" # 暗色强调色（柔和植物绿）
      nav_hover_text:
        light: "#304A37" # 亮色导航 hover 文字
        dark: "#1C211F" # 暗色导航 hover 文字

    # --- 字体（朱雀仿宋，TrionesType，OFL-1.1） ---
    # font_family 经 styles.html 注入为 --solitude-font-family，custom.css 的 --paper-font 直接引用它。
    # webfont_css 是 cn-font-split 的分片字体表：52 个 @font-face 按 unicode-range 切分，
    # 浏览器只下载当前页面用到的分片（实测首页 18 片、关于页 22 片）。锁 commit SHA 防上游变动。
    font:
      font_size: 16px
      code_font_size: 16px
      font_family: '"Zhuque Fangsong (technical preview)", "Noto Serif SC", "Songti SC", "SimSun", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", serif'
      code_font_family: '"JetBrains Mono", "Cascadia Code", Consolas, monospace'
      webfont_css: https://cdn.jsdmirror.com/gh/willow-god/Sharding-fonts@31edab303b89f4fc38d17f10e45d81140c510c97/ZhuqueFangsong-Regular/result.min.css

    # 注入到 <head> 的自定义 HTML/CSS（不改主题文件，随站点配置生效）
    extends:
      head:
        - "<style>.card-info .description{display:block}.card-info .description kbd{display:inline-block;padding:0 6px;margin:0 2px;border-radius:4px;border:1px solid currentColor;box-shadow:0 2px 0 rgba(0,0,0,.15);font-size:12px;line-height:1.5;vertical-align:middle}</style>"
        # Umami 站点统计
        - '<script defer src="https://um.081531.xyz/script.js" data-website-id="668e3622-d145-4b4b-a52f-8b41ae8357a8"></script>'
    # --- 友链交换页（/exchange/，content/exchange 的 type 需为 exchange） ---
    page:
      exchange:
        title: 友链交换
        subtitle: 想和喵洛阁交换友链？先看看下面的说明，确认符合要求后提交申请，机器人会自动审核并生效。
        # 主按钮：跳转 GitHub Issue 申请表单
        submit:
          url: https://github.com/kemiao-moretti/meowloge/issues/new?template=friend-link.yml
          text: 填写申请表单
          icon: fas fa-paper-plane
        # 次按钮组
        links:
          - name: 查看友链
            url: /links/
            icon: fas fa-link
        # 申请流程（编号步骤，按数组顺序输出）
        flow:
          - 确认贵站符合下方的友链要求，并先把本站加入贵站友链。
          - 准备好站点名称、链接、头像、封面图、描述与联系邮箱。
          - 点击「填写申请表单」提交，机器人校验通过后友链立即生效。
        # 友链要求卡片（icon 用 Font Awesome 类名，title + desc 必填）
        requirements:
          - title: 合规底线
            icon: fas fa-scale-balanced
            desc: 网站须符合中国大陆法律法规，不含博彩、NSFW 等违法违规内容，发现即移除。
          - title: 内容质量
            icon: fas fa-pen-nib
            desc: 至少 5 篇文章，且至少每月更新一次；原创或认真整理的内容优先。
          - title: 访问体验
            icon: fas fa-gauge-high
            desc: 网站需稳定可达，建议启用 HTTPS 并保持证书有效。
          - title: 广告适度
            icon: fas fa-rectangle-ad
            desc: 广告不应遮挡内容或影响正常阅读，拒绝强制跳转与弹窗。
          - title: 互惠原则
            icon: fas fa-handshake
            desc: 期望你先添加本站友链（非强制，但会优先通过审核）。
          - title: 长期维护
            icon: fas fa-screwdriver-wrench
            desc: 本站每日巡检友链状态，连续两天无法访问将暂时移除，修复后可自助恢复。
        # 域名说明
        domains:
          title: 域名说明
          accepted: 付费域名（.com/.cn/.net/.org 等）与可信免费域名（github.io、eu.org、Cloudflare Pages）均可接受。
          rejected: 暂不接受访问异常、存在明显安全风险或频繁变更的域名。
        # 本站信息（对方添加本站在贵站的友链时使用，页面提供可复制代码块）
        site:
          title: 本站信息
          note: 请先在贵站友链页面添加以上信息，再提交申请。
          items:
            name: 喵洛阁
            link: https://blog.518339.xyz/
            avatar: https://blog.518339.xyz/img/avatar.png
            descr: 每一段旅行，都有终点。
            linkpage: https://blog.518339.xyz/links/
        # 申请格式说明
        format:
          title: 申请格式
          desc: 申请表单需填写网站名称、网站链接、网站描述与联系邮箱；头像 URL 选填，留空会自动抓取站点 favicon；网站封面图选填，仅当本站友链以「封面卡片」样式展示时为必填，填了就会校验可访问性。
      # --- 友链页（/links/）配置 ---
      links:
        # 墓碑说明里「申请恢复」链接指向的地址（GitHub Issues 申请表单）
        # 留空则回退到友链交换页 /exchange/
        tombstone_recover_url: https://github.com/kemiao-moretti/meowloge/issues

    # --- AI 日报（/ai-news/） ---
    ai_news:
      enable: true
      api: https://60s-api.518339.xyz/v2/ai-news
      cache_minutes: 60
      timeout_ms: 8000
      range_days: 7
      timezone: Asia/Shanghai
      group_by_date: true
      title: AI 日报
      description: 聚合 AI、大模型与相关行业资讯，关注每天值得知道的新动态。
      loading: 正在获取今日 AI 资讯…
      empty: ""
      error: AI 日报暂时无法更新，将优先展示最近一期内容。
      error_empty: AI 日报请求失败，暂时没有可展示的内容，请重试或刷新页面。
      retry: 重试
      malformed: 今日数据格式异常，请稍后重试或刷新页面。
      previous: 上一期日报
      updated: 数据更新时间
      source: 来源
      detail: 摘要
      link: 阅读原文
      no_link: 暂无原文链接
    # --- 站点标识样式 ---
    site:
      name:
        class: text # 站点名的展示样式（text 表示纯文字）
        custom: 喵洛阁Meowloge # 自定义显示的站名文字（覆盖默认的 title）

    # --- 导航右侧"快捷分组"链接 ---
    # 显示在页头导航栏右侧的图标链接组
    nav:
      group:
        项目: # 分组名称
          - name: Memos # 链接显示名
            url: https://memos.518330.xyz/ # 跳转地址
            icon: https://a.favicon.im/usememos.com # 图标图片（static/img/avatar.png）
          # - name: 官方文档
          #   url: https://solitude.js.org/
          #   icon: /img/avatar.png

    # --- 首页顶部 Banner 区域 ---
    hometop:
      banner:
        title: 喵洛阁Meowloge<br>记录我的一些文字 # 首页大标题（支持 <br> 换行）
        desc: 博客写作、项目分享、日常记录 # Banner 下方的描述文字
      # 首页"推荐文章"卡片列表（不是自动生成的，完全由这里手工指定）
      recommendList:
        # - title: 开始使用 Solitude Hugo      # 卡片标题
        #   url: /p/getting-started.html      # 点击跳转的文章链接
        #   cover: /img/demo/cover-getting-started-v2.webp   # 卡片封面图
        #   label: 迁移指南                    # 卡片上的角标文字
        #   color: "#3b82f6"                  # 角标颜色
        # - title: 配置首页推荐与侧栏组合
        #   url: /p/homepage-and-aside.html
        #   cover: /img/demo/cover-pagination-v2.webp
        #   label: 配置指南
        #   color: "#16a34a"

    # --- 侧边栏（aside）模块配置 ---
    aside:
      # home/post/page 分别控制首页、文章页、普通页面三种场景的侧栏
      # noSticky: 不吸顶的模块（随页面滚动） / Sticky: 吸顶的模块（滚动时固定）
      # 模块名可换顺序、增删，逗号分隔
      home:
        noSticky: about,ipWelcome,clock # 首页不吸顶：作者卡片、访客欢迎、时钟
        Sticky: newest_comment,allInfo # 首页吸顶：最新评论、站点信息
      post:
        noSticky: about,clock
        Sticky: newestPost,newest_comment,allInfo # 文章页吸顶：最新文章、最新评论、站点信息
      page:
        noSticky: about,clock
        Sticky: newestPost,newest_comment,allInfo
      # --- 时钟模块（clock）：移植自 hexo-butterfly-clock-veeink ---
      clock:
        enable: true # 是否启用侧栏时钟卡片
        city: 南京 # 卡片上显示的城市名
        locationId: "101190101" # 和风天气 LocationID（南京）
        qweatherKey: a228d00223c6456cb3b4879167e58578 # 和风天气 API Key
        qweatherHost: https://devapi.qweather.com # 和风天气 API 主机（免费开发版）
        timezone: Asia/Shanghai # 时钟时区
        cacheMinutes: 30 # 天气结果缓存分钟数（省额度）
      # --- 访客欢迎模块（ipWelcome）：放在时钟卡片上方，仅首页显示 ---
      ipWelcome:
        enable: true # 是否启用侧栏访客欢迎卡片
        # 站长坐标（用于计算访客与站长的直线距离，默认与时钟城市南京一致）
        bloggerLat: 32.0603 # 纬度（南京）
        bloggerLng: 118.7969 # 经度（南京）
        cacheHours: 24 # 定位结果缓存小时数（避免每次刷新都请求外部接口）
        timeoutMs: 6000 # 单次接口超时毫秒数
        # 主源：一次返回 ip / 国家 / 省市 / 经纬度，无需 Key
        primaryApi: https://60s-api.518339.xyz/v2/ip
        # 备用取 IP 源（主源失败时按顺序尝试，成功即停）
        ipApis:
          - https://api.ipify.org?format=json
          - https://icanhazip.com/
        # 备用查位置源：%s 会被替换为上一步取得的 IP，无需 Key
        fallbackApi: https://ipapi.co/%s/json/
        # 地区 Tip 文案（精简版）：key 支持「省-市」「市」「省」「国家」逐级回退
        tips:
          default: 带我去你的城市逛逛吧
          北京: 烤鸭排队的队伍，算我一个
          上海: 众所周知，中国只有两个城市
