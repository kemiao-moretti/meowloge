          江苏-南京: 梧桐大道走一走，秋天最好看
          江苏-苏州: 上有天堂，下有苏杭
          江苏: 散装是必须要散装的
          浙江-杭州: 东风渐绿西湖柳，雁已还人未南归
          浙江: 望海楼明照曙霞，护江堤白蹋晴沙
          四川-成都: 康康熊猫，再来碗担担面
