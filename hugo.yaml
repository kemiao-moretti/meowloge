          德国: Die Zeit verging im Fluge.
          俄罗斯: 干了这瓶伏特加
          加拿大: 拾起一片枫叶赠予你
          澳大利亚: 一起去大堡礁吧
      # 作者个人信息卡片（侧栏最上方的名片）
      my_card:
        author:
          img: https://q2.qlogo.cn/headimg_dl?dst_uin=3149261770&spec=0 # 头像图片地址
          emoji: "😊" # 名片上的装饰表情
        description: 每一段旅行，都有终点。 # 名片签名
        content: 我在本博客上记录着我的一些文字~<br>如果你在访问的过程中发现问题，优先检查网络，<kbd>CTRL</kbd> + <kbd>F5</kbd> 刷新网页。 # 打字机效果的前缀文字（支持 HTML，需配合 extends.head 里的样式覆盖）
        witty_words: [人生如逆旅，我亦是行人。] # 打字机轮播的句子
        # 名片上的社交信息图标
        information:
          - name: GitHub
            url: https://github.com/kemiao-moretti/blog
            icon: fab fa-github
      # 页脚上方的"站点信息"模块
      siteinfo:
        runtime: 2024-11-01 12:00:00 # 建站时间，页脚显示"本站已运行 X 天"从此时间起算

    # --- 文章页配置 ---
    post:
      default:
        copyright:
          # author_background: /img/demo/cover-shortcodes-v2.webp   # 文末版权卡片的作者背景图
          # ↑ 启用后会触发主题的 layered 分层头像（背景图铺满 + 前景贴纸居中），
          #   前景需为透明贴纸素材；本站前景是方形 logo，故保持注释，
          #   让版权卡片只显示单张圆形头像。
      # 文章顶部 meta 信息展示开关
      meta:
        pv: true # 是否显示文章浏览量
        comment: true # 是否显示评论数
      # 封面主色调提取：让文章头图融入页面背景
      covercolor:
        enable: true # 是否启用
        mode: local # 取色方式（local 表示本地处理图片取色）
      # 文末"赞赏/打赏"模块：渲染在正文与版权卡片之后
      # 弹层的几何样式来自主题 pages/post.css 的 .post-reward 区块，
      # 展开交互（悬停 / 聚焦 / 触屏点击）由主题的兼容层提供。
      # 文案留空时回落到主题 i18n 的 postReward* 三处默认值。
      award:
        enable: true # 是否启用打赏
        button: 赞赏 # 按钮文案
        title: 喜欢这篇文章，就请我喝杯奶茶吧 # 弹层标题
        link: https://github.com/kemiao-moretti/meowloge/issues/new?template=sponsor.yml # 弹层底部按钮地址，留空则不渲染按钮
        link_text: 申请加入赞赏名单 # 按钮主文案
        link_desc: 审核通过后出现在关于页的公开名单里 # 按钮副文案，留空则不显示
        list:
          - name: 支付宝 # 打赏方式名称
            qrcode: /img/sponsor/zhifubao.png # 收款二维码图片
          - name: 微信
            qrcode: /img/sponsor/weixin.png
      # 文章分享按钮
      share:
        enable: false # 是否启用分享
        list: [] # 分享平台列表（留空表示不展示）
    # --- 文章 AI 摘要 ---
    ai_summary:
      enable: true # 是否在文章页展示 ai_summary 字段
      title: AI 摘要
      model: AI generated
      loading: 正在整理文章重点……
    # --- 页脚配置 ---
    footer:
      randomlink: true # 页脚「友链」列：从 data/links.yaml 随机抽 3 条 + 刷新按钮（不足 3 条则全显示）
      information:
        author: https://openlist.081531.xyz/d/yidong/imgbed/meowloge.webp # 页脚展示的站点 logo
        left: # 页脚左侧的链接
          - name: GitHub
            url: https://github.com/kmoretti
            icon: fab fa-github
          - name: Telegram
            url: https://s.081531.xyz/telegram
            icon: fab fa-telegram
          - name: QQ
            url: https://s.081531.xyz/qq
            icon: fab fa-qq
        right: # 页脚右侧的链接
          - name: 订阅
            url: /index.xml # RSS 订阅地址
            icon: fas fa-rss
          - name: BiliBili
            url: https://s.081531.xyz/bilibili
            icon: fab fa-bilibili
          - name: Mail
            url: mailto:contact@518339.xyz
            icon: fas fa-envelope
      # 页脚的"链接分组"（多列站点导航）
      group:
        探索: # 分组标题
          - name: 文章
            url: /archives/
          - name: 分类
            url: /categories/
          - name: 标签
            url: /tags/
        项目:
          - name: 官方文档
            url: https://solitude.js.org/
          - name: GitHub
            url: https://github.com/kemiao-moretti/meowloge
        关于:
          - name: 友链
            url: /links/
          - name: 关于我
            url: /about/
      # 页脚底部的自定义自定义链接行
      links:
        - name: 订阅
          url: /index.xml

    # --- 评论系统 ---
    comment:
      use: artalk # 使用哪个评论系统（artalk / valine，切回 Valine 改回 valine 即可）
      commentBarrage: true # 是否启用"弹幕式评论"（文章页底部滚动飘过的评论）
      lazyload: false # 评论组件是否懒加载（滚动到评论区才加载）
      count: true # 是否显示评论数
      sidebar: true # 是否在侧栏显示评论模块
      pv: true # 是否统计页面浏览量
      avatar: https://cn.cravatar.com # 评论者头像服务地址
      hot_tip:
        enable: false # 是否显示"热评"提示
        count: 3 # 热评数量
      # 侧栏"最新评论"模块
      newest_comment:
        enable: true # 是否启用
        storage: 0.5 # 本地缓存时间（小时），减少重复请求
        limit: 5 # 显示的评论条数
    # --- Valine 评论系统配置（use: valine 时生效） ---
    valine:
      appId: lUYWcy5GblLUZOCvcSdDiLP9-gzGzoHsz # LeanCloud 应用 AppID
      appKey: nKcAGPsR1ydwQjEFZcMFNGJG # LeanCloud 应用 AppKey
      serverURLs: https://luywcy5g.lc-cn-n1-shared.com # LeanCloud 服务器地址
      avatar: https://weavatar.com/avatar/ # 头像服务地址
      visitor: true # 是否启用文章阅读量统计
      style: true # 是否使用主题定制的评论样式
      option: {} # 传给 Valine 的额外配置项
    # --- Artalk 评论系统配置（use: artalk 时生效，自托管服务端） ---
    artalk:
      server: https://artalk.518339.xyz # Artalk 服务端地址（需在后台信任域名中加入博客域名）
      site: 喵洛阁Meowloge # Artalk 后台配置的站点名，需与服务端一致
      pv: true # 使用 Artalk page_pv 统计文章浏览量
      placeholder: 欢迎留下你的文字~ # 评论区输入框占位文案（留空用 Artalk 默认）
      option: {} # 传给 Artalk.init 的额外配置项（覆盖同名默认值）

    # --- 说说页（/shuoshuo/，Ech0 或 Memos 数据源） ---
    shuoshuo:
      enable: true # 是否启用该页面渲染
      source: memos # 数据源：ech0 | memos（缺省 ech0，向后兼容）
      api: https://m.081531.xyz # 数据源 API 地址（source=memos 时使用下方 memos.api）
      page_size: 30 # 每页条数
      cache_minutes: 30 # 前端缓存时长（分钟）
      author:
        name: 克喵Moretti # 卡片头部昵称（数据源返回的 username 优先）
        avatar: https://q2.qlogo.cn/headimg_dl?dst_uin=3149261770&spec=0 # 头像
      like: true # 是否显示点赞按钮（仅 Ech0 生效）
      tags:
        enable: true # 是否显示标签
      extensions: # 扩展卡片开关（按 source 取对应数据）
        github: true # GITHUBPROJ（Ech0）
        website: true # WEBSITE（Ech0 / Memos 正文外链自动推导）
        music: true # MUSIC（Ech0）
        video: true # VIDEO（Ech0）
        tweet: true # TWEET（Ech0）
        location: false # LOCATION（默认关闭，避免暴露精确坐标）
      memos: # source=memos 时生效
        api: https://memos.518339.xyz # Memos 实例地址
        creator: users/kemiao # 仅拉取该用户 memos（留空则展示全部公开 memos）
        public_only: true # 仅展示 PUBLIC 可见性

    # --- 友链朋友圈（/fcircle/，hexo-circle-of-friends 远程数据源） ---
    fcircle:
      enable: true # 是否启用该页面渲染
      api: https://fcircle.518339.xyz # 自部署后端地址（代码会自动拼 /all）
      page_size: 24 # 每次"再来亿点"加载的文章条数
      cache_minutes: 10 # 整表缓存时长（分钟），0 表示不缓存
      random_post: true # 是否显示"随机钓鱼"（随机推荐一篇友链文章）
      author_modal: true # 点击作者头像是否弹出 TA 的文章列表
      sort_toggle: true # 是否允许切换"发布时间 / 更新时间"排序
      limit: 0 # 最多展示的文章数，0 表示不限制
      error_img: /img/default_avatar.avif # 头像加载失败时的兜底图片

    # --- 控制台（按快捷键呼出的管理面板） ---
    console:
      recentComment:
        enable: true # 控制台中是否显示最近评论
        storage: 0.2 # 缓存时间（小时）

    # --- 右键菜单 ---
    right_menu:
      commentBarrage: true # 右键菜单中是否显示"评论弹幕"开关项
      ctrlOriginalMenu: true # 按住 Ctrl + 右键时使用浏览器原生菜单

    # --- "最近评论"独立页面 ---
    recent_comments:
      enable: true # 是否启用该页面模块
      limit: 50 # 展示的评论数量
      cache: 0.2 # 缓存时间（小时）
      page: /recentcomments/ # 页面路径（需在 content 中有对应页面）

    # --- "即刻/短文"（brevity）页面：本地数据演示（与 Ech0 说说页共存） ---
    brevity:
      enable: true # 是否启用
      page: /brevity/ # 页面路径

    # --- "信封/留言板"动画页面 ---
    envelope:
      enable: true # 是否启用
      line: 6 # 信纸行数
      speed: 20 # 打字动画速度
      hover: true # 鼠标悬停时是否暂停动画
      loop: true # 是否循环播放
      page: /message/ # 页面路径

    # --- 底部悬浮音乐播放器 ---
    capsule:
      enable: true # 是否启用
      id: "17970719439" # 音乐 ID（网易云歌单 ID）
      server: netease # 音乐服务（netease = 网易云音乐）
      type: playlist # 类型（playlist = 歌单）
      volume: 0.8 # 默认音量（0~1）
    # --- 独立音乐页面配置 ---
    music:
      enable: true # 是否启用
      id: "17970719439" # 歌单 ID
      server: netease # 音乐服务
      type: playlist # 类型
      mutex: true # 播放时互斥（同一时间只播一个）
      volume: 0.8 # 默认音量
      order: list # 播放顺序（list = 按列表顺序）

    # --- 键盘快捷键 ---
    keyboard:
      enable: true # 是否启用快捷键功能
      list: # 快捷键列表：modifier 修饰键 + key 主键 + action 动作
        - modifier: shift
          key: K
          action: toggleKeyboard # 打开/关闭快捷键面板
        - modifier: shift
          key: A
          action: showConsole # 打开控制台
        - modifier: shift
          key: M
          action: musicToggle # 切换音乐播放
        - modifier: shift
          key: D
          action: toggleTheme # 切换深色/浅色主题
        - modifier: mod
          key: F
          action: openSearch # 打开搜索（mod = Ctrl/⌘）
        # AI 快捷键需要站点自行注册：
        # 通过 Solitude.registerShortcutAction("openAi", handler) 注册动作，
        # 或改用 url: ai/ 指向 AI 页面
        # - name: 打开AI智能对话
        #   modifier: shift
        #   key: C
        #   action: openAi
        - modifier: shift
          key: R
          action: randomPost # 随机跳转一篇文章
        # 以下两条用 url 代替 action：直接跳转到指定路径
        - name: 返回首页
          modifier: shift
          key: H
          url: ./ # 跳转到首页
        - name: 友链页面
          modifier: shift
          key: L
          url: links/ # 跳转到友链页

    # --- 代码高亮 ---
    highlight:
      enable: true # 是否启用代码高亮
      copy: true # 代码块是否显示"复制"按钮
      line_numbers: true # 是否显示行号
      max_height: 360 # 代码块最大高度（px），超出后滚动/折叠
      themes:
        light: github-light # 浅色模式下的高亮主题
        dark: github-dark # 深色模式下的高亮主题

    # --- 图片灯箱（点击图片放大预览） ---
    lightbox: fancybox # 使用的灯箱库（fancybox）

    # --- CDN 配置 ---
    cdn:
      shiki: https://esm.sh/shiki@4.4.3 # Shiki 语法高亮库的 CDN 地址
      artalk: https://cdn.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.js # Artalk 评论 JS SDK（use 含 artalk 时加载）
      artalk_css: https://cdn.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.css # Artalk 评论样式（use 含 artalk 时加载）
      marked: https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js # 说说页 Markdown 渲染
      dompurify: https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js # 说说页 HTML 防 XSS
      echarts: https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js # 数据统计页图表（仅该页加载）

    # --- 数据统计页（/stats/）---
    stats:
      weekday_label: true # 热力图左侧是否标注星期（关掉可省下左侧留白）
      week_start: monday # 一周从哪天开始：sunday/monday/.../saturday，或 0-6（0 = 周日）
      weekday_names: [] # 自定义星期名（固定 7 项、从周日排到周六）；留空则取 i18n，跟随站点语言
      # Umami 站访数据（公开分享方案，无需 API Key）
      # share_id：在 Umami 后台「网站 → 分享」中创建分享链接后得到的 ID（与 website_id 不同），
      #           可安全暴露在前端；未配置时组件显示不可用提示并优雅降级。
      # website_id：仅作备注保留，公开分享接口以 share_id 为准。
      umami:
        enable: true # 是否在统计页展示站访数据区块
        endpoint: https://um.081531.xyz # Umami 实例地址（不带末尾斜杠）
        share_id: aEm4tZWjLPsyKHl6 # 公开分享 ID（需在 Umami 后台创建分享链接）
        website_id: 668e3622-d145-4b4b-a52f-8b41ae8357a8

    # --- 搜索功能 ---
    search:
      enable: true # 是否启用搜索
      type: local # 搜索类型（local = 本地搜索，无需外部服务）
      local:
        preload: true # 是否预加载搜索索引（页面打开时就加载 search.xml）
        CDN: /search.xml # 搜索索引文件地址（由 outputs.home 里的 Search 输出生成）

    # --- 404 页面 ---
    errorpage:
      # img：旧版 404 图片素材。当前模板改为纯 CSS / 纯文字实现，已不再读取该字段，
      #      保留仅为兼容与后续回退，不影响页面渲染。
      img: /img/404.avif
      eyebrow: "PAGE NOT FOUND" # 主标题上方的小标签，留空则不显示
      title: 这页走丢了。 # 页面主标题，留空则回退到多语言文案「页面未找到」
      text: 链接可能已经搬家，或者这颗糖被放进了另一只盒子。 # 主标题下方的说明文案
      brand: "<K.M/>" # 糖纸贴纸上的品牌标记，留空则使用站点标题
      recommendList: true # 是否在 404 页面底部展示最近 3 篇文章

    # --- 外链中转（/go/）：站外链接先经提示页核对目标域名，再前往 ---
    # 页面模板在主题 layouts/go/，运行时改写逻辑在 assets/ts/external_link.ts，
    # 这里只放本站在用的取值；中转页这个路由本身由 content/go.md 提供。
    external_link:
      enable: true # 是否启用外链中转
      page: /go/ # 中转页路径，需与 content/go.md 对应
      param: u # 承载目标地址的查询参数名
      encode: base64url # 目标地址编码：base64url（默认，不明文暴露）| none（便于排查用）
      countdown: 4 # 自动前往的秒数；设为负数则只保留手动按钮
      pause_on_hover: true # 倒计时期间悬停或键盘聚焦时暂停
      referrer_guard: false # true = 仅当来源为本站时才展示中转页，否则提示来源异常
      # 生效容器：只有落在这些选择器里的链接会被改写（当前为文章正文 + 友链页）
      containers:
        - .post-content # 文章正文
        - "#banners" # 友链页顶部跑马灯
        - "#friend-links-list" # 友链页友链列表
      exclude: [] # 页面路径前缀黑名单，命中则整页不改写
      ignore_attrs:
        - data-fancybox # 灯箱图片的锚点，不能当外链跳转
        - data-no-safego # 需要直连的链接自行加上这个属性即可跳过中转
      # 视为「站内」直接放行的域名：按主机名后缀匹配，写根域名即可覆盖其子域
      whitelist:
        - 518339.xyz # 本站 blog.518339.xyz
        - 518330.xyz # Memos 说说
        - 081531.xyz # Artalk / Umami / 60s API / OpenList 图床
        - kemiaosw.top # 站长邮箱域名
      appearance:
        eyebrow: 出站提醒
        title: "" # 留空则回落到站点标题
        subtitle: 你要离开本站了，先去下一站看看
        avatar: "" # 留空则回落到侧栏名片头像
        leave_text: 即将前往
        copy_text: 复制链接
        copied_text: 已复制
        # {seconds} 是倒计时数字的占位符，删掉它则只显示文字不显示数值
        countdown_text: 将在 {seconds} 秒后自动前往，请先确认链接安全
        manual_text: 请确认链接安全后，再点击「继续前往」
        confirm_text: 继续前往
        cancel_text: 返回上一页
        invalid_text: 这个跳转链接不完整或格式不对
        guard_text: 链接来源异常，本站不代为跳转
        pause_text: 已暂停自动跳转
        resume_text: 已继续自动跳转
        back_home: 回到首页
        noscript_text: 这个中转页需要 JavaScript 才能解析目标地址，请开启后重试，或直接回到首页。
