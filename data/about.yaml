  - type: story
    label: 关于本站
    title: 为什么搭建喵洛阁？
    content: |
      喵洛阁是一块安静的自留地，用来安放我写下的一些文字：有折腾博客主题的配置指南，有前端与服务的实践记录，也有一些生活的碎碎念。页面不必喧闹，但每一篇文章都应该被清楚地组织、舒适地阅读，也能被搜索、分类和长期保存。

      站点基于 Solitude 主题搭建，并定制成现在的糖果屋风格：粗描边、硬阴影与圆角统一，亮色与暗色模式下都保持一致的阅读体验。构建过程依赖 Hugo 原生页面集合、Taxonomies、Go Templates 和资源管线，配置与数据契约清晰，便于长期维护。

      这里展示的不只是主题能力，也是我持续记录、持续折腾的过程。未来的文章会继续围绕技术、生活与兴趣展开，让这些文字始终服务于表达本身。
